    environment:
      BUZZ_RELAY_URL: ${BUZZ_AGENT_RELAY_URL:?set BUZZ_AGENT_RELAY_URL}
      BUZZ_PRIVATE_KEY: ${BUZZ_GIBSON_PRIVATE_KEY:?set BUZZ_GIBSON_PRIVATE_KEY}
      NOSTR_PRIVATE_KEY: ${BUZZ_GIBSON_PRIVATE_KEY:?set BUZZ_GIBSON_PRIVATE_KEY}
      # Admitted by relay membership rather than a minted NIP-OA tag, so the harness
