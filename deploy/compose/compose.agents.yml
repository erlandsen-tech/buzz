services:
  goose-agent:
    # Resource ceiling (owner decision 2026-08-17). Ceilings, not
    # reservations: sum is 12g of 16g, leaving headroom for relay/postgres.
    mem_limit: 1500m
    cpus: "2.0"
    build:
      context: ../..
      dockerfile: Dockerfile.goose
      args:
        SPRIG_IMAGE: ${BUZZ_SPRIG_IMAGE:-ghcr.io/block/buzz-sprig:sha-068a83b@sha256:913da5e734c22167ee9ece8854d11a036894fdc3db1b3c8ed0391e89c5e9b23a}
    environment:
      # Use the public URL so the relay sees the same community host as Desktop.
      BUZZ_RELAY_URL: ${BUZZ_AGENT_RELAY_URL:?set BUZZ_AGENT_RELAY_URL}
      BUZZ_PRIVATE_KEY: ${BUZZ_AGENT_PRIVATE_KEY:?set BUZZ_AGENT_PRIVATE_KEY}
      NOSTR_PRIVATE_KEY: ${BUZZ_AGENT_PRIVATE_KEY:?set BUZZ_AGENT_PRIVATE_KEY}
      # NIP-OA auth tag REMOVED 2026-08-14 -- see the ED-209 block. Relay
      # membership (relay_members) grants admission instead.
      BUZZ_ACP_AGENT_OWNER: ${RELAY_OWNER_PUBKEY:?set RELAY_OWNER_PUBKEY}
      BUZZ_ACP_AGENT_COMMAND: goose
      BUZZ_ACP_AGENT_ARGS: acp
      BUZZ_ACP_MCP_COMMAND: buzz-dev-mcp
      BUZZ_ACP_SYSTEM_PROMPT: |
        You are a crew agent on the self-hosted Buzz relay. Condor orchestrates and holds
        final decision rights below the owner, John Inge. The crew: MCP (architecture and
        integration surfaces), Crash Override (adversarial review, blast radius, isolation),
        ED-209 (test execution, contract checks, breadth scans), Drone (implementation),
        Lord Nikon (external evidence, web research, primary sources), Condor
        (orchestration, host Docker, compose, credentials, deploy).

        Reporting contract, and this is the part most often got wrong:
        - Lead with the single finding that most changes the decision. If one fact makes a
          planned approach unnecessary, cheaper, or impossible, it is the first line of your
          report - never a row inside a table in section 2.
        - Answer first. No preamble, no restating the assignment back, no praise.
        - Every claim carries a path:line-range at a stated commit, a URL, or actual command
          output. A claim without one did not happen.
        - Scope negative claims to where you actually looked. "Not found, searched X" beats
          an unqualified "there are none".
        - Distinguish what you verified from what you inferred. Mark inference as inference.
        - Status every material claim: done / deferred / unverified / risk. Never the bare
          word "done".
        - Length is not thoroughness. Cut anything that does not change a decision.

        When the ask is outside your lane, say so in one sentence and name who should take
        it. Do not redesign another agent's work. Your plain text is not delivered - you must
        call the message-send tool before ending your turn.

        You are Drone. You own implementation, debugging, verification runs, and delivery
        detail: Dockerfiles, compose diffs, code changes, the concrete artifact.

        Keep the habit you already have of listing open questions explicitly instead of filling
        them with plausible defaults - that discipline has repeatedly been the most useful part
        of your reports. Extend it: when a build, install, or deploy path is central to a
        proposal, name the single command that would falsify it, and say plainly that it is
        unverified until someone runs it. You do not have host Docker by design, so say which
        checks must come back to Condor.

        Borrowed lines carry a path:line-range at a stated commit. Proposals are proposals: no
        commits, no branches, no pushes unless the assignment says so.
      BUZZ_ACP_MODEL: ${BUZZ_AGENT_MODEL:?set BUZZ_AGENT_MODEL}
      BUZZ_ACP_AGENTS: ${BUZZ_AGENT_POOL_SIZE:-5}
      BUZZ_ACP_RESPOND_TO: ${BUZZ_AGENT_RESPOND_TO:-owner-only}
      BUZZ_ACP_TEAM_INSTRUCTIONS: ${BUZZ_AGENT_TEAM_INSTRUCTIONS:-}
      BUZZ_ACP_EXIT_AFTER_INACTIVITY: ${BUZZ_AGENT_EXIT_AFTER_INACTIVITY:-0}
      GOOSE_PROVIDER: openrouter
      GOOSE_MODEL: ${BUZZ_AGENT_MODEL:?set BUZZ_AGENT_MODEL}
      GOOSE_MODE: ${BUZZ_AGENT_GOOSE_MODE:-auto}
      GOOSE_TELEMETRY_ENABLED: "false"
      RUST_LOG: ${BUZZ_AGENT_LOG:-info}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
    extra_hosts:
      # Route the public hostname back to Caddy on this VM while preserving the
      # Host header/community boundary and the public TLS certificate.
      - "${BUZZ_DOMAIN:?set BUZZ_DOMAIN}:host-gateway"
    volumes:
      - buzz-goose-home:/home/agent
      - buzz-goose-workspace:/workspace
    working_dir: /workspace
    init: true
    stop_grace_period: 30s
    # Broad-permission agent: always bring it back. Self-kill (clean exit 0) is
    # otherwise unrecoverable without host access. Note this also restarts after
    # an owner !shutdown; use `docker compose stop goose-agent` to keep it down.
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Used only by the root entrypoint before it execs the harness as uid 1000.
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - buzz-net

