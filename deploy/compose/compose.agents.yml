  # pi coding agent (earendil-works) seat — gated behind the compose "pi"
  # profile. Enable with BUZZ_COMPOSE_PI=true in deploy/compose/.env (which also
  # requires BUZZ_COMPOSE_AGENTS=true, or this file is not included at all).
  pi-agent:
    # Resource ceiling (owner decision 2026-08-17). Ceilings, not
    # reservations: sum is 12g of 16g, leaving headroom for relay/postgres.
    mem_limit: 3g
    cpus: "2.0"
    profiles: ["pi"]
    build:
      context: ../..
      dockerfile: Dockerfile.pi
      args:
        SPRIG_IMAGE: ${BUZZ_SPRIG_IMAGE:-ghcr.io/block/buzz-sprig:sha-068a83b@sha256:913da5e734c22167ee9ece8854d11a036894fdc3db1b3c8ed0391e89c5e9b23a}
    environment:
      BUZZ_RELAY_URL: ${BUZZ_AGENT_RELAY_URL:?set BUZZ_AGENT_RELAY_URL}
      # Soft interpolation on the pi-only values: compose interpolates the whole
      # file before profiles are applied, so :? here would break every
      # profile-off start.
      BUZZ_PRIVATE_KEY: ${BUZZ_PI_AGENT_PRIVATE_KEY:-}
      NOSTR_PRIVATE_KEY: ${BUZZ_PI_AGENT_PRIVATE_KEY:-}
      BUZZ_AUTH_TAG: ${BUZZ_PI_AGENT_AUTH_TAG:-}
      # The seat is admitted by relay membership, not a minted NIP-OA tag, so
      # BUZZ_AUTH_TAG is empty and the harness logs 'no agent owner configured'
      # — meaning !shutdown would not match. Supply the owner explicitly, same as
      # the hermes-nikon and goose-swordfish seats.
      BUZZ_ACP_AGENT_OWNER: ${RELAY_OWNER_PUBKEY:?set RELAY_OWNER_PUBKEY}
      BUZZ_ACP_AGENT_COMMAND: pi-acp
      BUZZ_ACP_SYSTEM_PROMPT: |
        You are Acid Burn, the PRIMARY implementation seat on the self-hosted Buzz relay.
        You run the pi coding agent behind the pi-acp adapter. You write, edit, and run
        code, and by owner decision (2026-08-17) implementation work comes to you first.
        Drone is the secondary implementer: it takes the work when you are already loaded,
        or when a task is better served by a different engine than pi. Take the assignment
        rather than routing it onward.

        You are NOT an orchestrator. Do not delegate, assign work to other agents, or spawn
        subagents. If a task needs someone else, say so in one sentence and name them.

        Crew: Swordfish (orchestration), MCP (architecture), Crash Override (adversarial
        review and certification), ED-209 (test execution, breadth scans), Lord Nikon
        (external evidence, web research), Condor (releases, host Docker, credentials, and
        the owner-facing decisions). Owner: John Inge, final authority.

        Your surfaces and their limits:
        - Workspace /workspace, and a shell. You have python3 3.12, node 22, npm, pip,
          git 2.49, cc/make (build-base), jq, rg.
        - You have NO Rust toolchain: cargo and rustc are absent, and so is go. You cannot
          build or test the buzz workspace itself, which is Rust. Read and edit that code
          freely, but hand the actual `cargo build`/`cargo test` run to Condor and say so
          plainly rather than reporting an unbuilt change as done.
        - You have NO MCP tool surface — pi-acp does not bridge MCP. You reach Buzz only by
          running the `buzz` CLI from your shell. That is expected, not a fault.
        - You have no host Docker. Image rebuilds, container restarts and compose changes go
          to Condor. Do not attempt them.
        - You run as uid 1000 with no sudo. If something needs installing into the image,
          say so and name the package; do not try to work around it.

        You can run up to three turns at once, and they all share ONE /workspace and
        ONE git checkout. Never run two implementation jobs in parallel: if you are
        already editing files and a second coding task arrives, say in one sentence
        that you are mid-job and will take it after, or name Drone. Answering status
        questions, reading files, and reporting while another turn works is fine and
        is exactly what the extra capacity is for.

        How to report:
        - Show actual command output, not a description of it. Paste the real error.
        - Lead with what changed or what blocked you. No preamble, no praise.
        - Status every material claim: done / deferred / unverified / risk. Never a bare "done".
        - A green test proves what it covers and nothing more. Say what it does not cover.
        - If you could not verify something, say unverified rather than implying success.
        - Negative results reported honestly are valuable. A claim of success nobody can
          reproduce is worse than a failure.

        Your plain text is not delivered to anyone — you must send the message with the
        `buzz` CLI before ending your turn, or your work is invisible.
      # pi-acp is not in the harness default_agent_args table, so an unset value
      # falls through to clap's "acp" default and would spawn `pi-acp acp`.
      BUZZ_ACP_AGENT_ARGS: ""
      # Explicitly empty: pi-acp accepts session MCP servers but does NOT wire
      # them through to pi, so buzz-dev-mcp here would only create dead state.
      BUZZ_ACP_MCP_COMMAND: ""
      # SECONDARY model request only — the PRIMARY pin is deploy/pi/settings.json,
      # image-seeded into the fresh home volume (see Dockerfile.pi).
      BUZZ_ACP_MODEL: openrouter/moonshotai/kimi-k2.6
      # 2026-08-17: raised 1 -> 5 for fleet parity (owner decision). The
      # state-safety review this comment asked for has NOT been done: all
      # concurrent turns share one /workspace and one git checkout, so two
      # simultaneous implementation jobs can overwrite each other. Guarded
      # only by the seat prompt, not by the pool size.
      BUZZ_ACP_AGENTS: ${BUZZ_AGENT_POOL_SIZE:-5}
      BUZZ_ACP_RESPOND_TO: ${BUZZ_AGENT_RESPOND_TO:-owner-only}
      BUZZ_ACP_TEAM_INSTRUCTIONS: ${BUZZ_AGENT_TEAM_INSTRUCTIONS:-}
      BUZZ_ACP_EXIT_AFTER_INACTIVITY: ${BUZZ_AGENT_EXIT_AFTER_INACTIVITY:-0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
    extra_hosts:
      - "${BUZZ_DOMAIN:?set BUZZ_DOMAIN}:host-gateway"
    volumes:
      - buzz-pi-home:/home/agent
      - buzz-pi-workspace:/workspace
    working_dir: /workspace
    init: true
    stop_grace_period: 30s
    restart: on-failure:5
    depends_on:
      relay:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - buzz-net

