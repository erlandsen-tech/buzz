  hermes-nikon:
    # Resource ceiling (owner decision 2026-08-17). Ceilings, not
    # reservations: sum is 12g of 16g, leaving headroom for relay/postgres.
    mem_limit: 1500m
    cpus: "2.0"
    build:
      context: ../..
      dockerfile: Dockerfile.hermes
      args:
        SPRIG_IMAGE: ${BUZZ_SPRIG_IMAGE:-ghcr.io/block/buzz-sprig:sha-068a83b@sha256:913da5e734c22167ee9ece8854d11a036894fdc3db1b3c8ed0391e89c5e9b23a}
    image: buzz-prod-goose-hermes:latest
    environment:
      BUZZ_RELAY_URL: ${BUZZ_AGENT_RELAY_URL:?set BUZZ_AGENT_RELAY_URL}
      BUZZ_PRIVATE_KEY: ${BUZZ_NIKON_PRIVATE_KEY:?set BUZZ_NIKON_PRIVATE_KEY}
      NOSTR_PRIVATE_KEY: ${BUZZ_NIKON_PRIVATE_KEY:?set BUZZ_NIKON_PRIVATE_KEY}
      # Relay membership grants admission, so no NIP-OA auth tag. The harness
      # still needs an owner to match !shutdown against (docs/remote-agents.md
      # "Owner resolution"), hence BUZZ_ACP_AGENT_OWNER.
      BUZZ_ACP_AGENT_OWNER: ${RELAY_OWNER_PUBKEY:?set RELAY_OWNER_PUBKEY}
      BUZZ_ACP_AGENT_COMMAND: hermes
      BUZZ_ACP_AGENT_ARGS: acp
      BUZZ_ACP_MCP_COMMAND: buzz-dev-mcp
      BUZZ_ACP_MODEL: ${BUZZ_NIKON_MODEL:?set BUZZ_NIKON_MODEL}
      # 2026-08-17: raised 1 -> 5 with the rest of the fleet. The old pin
      # assumed concurrent hermes processes would corrupt the shared
      # HERMES_HOME state.db; that db runs in WAL mode (state.db-wal present),
      # which is multi-process safe. Residual risk is write contention, not
      # corruption.
      BUZZ_ACP_AGENTS: ${BUZZ_AGENT_POOL_SIZE:-5}
      # 2026-08-14, owner decision: #Utvikling members and the other crew
      # agents must all be able to call this seat, so it follows the shared
      # BUZZ_AGENT_RESPOND_TO switch (now anyone). This seat carries no NIP-OA
      # auth tag and has no HA or tailnet reach, so the blast radius is this
      # agent only -- it cannot fire a turn on ElHefe.
      BUZZ_ACP_RESPOND_TO: ${BUZZ_AGENT_RESPOND_TO:-owner-only}
      BUZZ_ACP_TEAM_INSTRUCTIONS: ${BUZZ_AGENT_TEAM_INSTRUCTIONS:-}
      BUZZ_ACP_EXIT_AFTER_INACTIVITY: ${BUZZ_AGENT_EXIT_AFTER_INACTIVITY:-0}
      HERMES_HOME: /home/agent/.hermes
      # The upstream image fences the Hermes native write tool into /opt/data,
      # which is root-owned and unreadable to uid 1000 here — every write through
      # that tool failed "outside HERMES_WRITE_SAFE_ROOT". Repoint at the workspace
      # volume the agent actually owns.
      HERMES_WRITE_SAFE_ROOT: /workspace
      HERMES_LAZY_INSTALL_TARGET: /home/agent/.hermes/lazy-packages
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RUST_LOG: ${BUZZ_AGENT_LOG:-info}
    extra_hosts:
      - "${BUZZ_DOMAIN:?set BUZZ_DOMAIN}:host-gateway"
    volumes:
      - buzz-nikon-home:/home/agent
      - buzz-nikon-workspace:/workspace
    working_dir: /workspace
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - buzz-net

